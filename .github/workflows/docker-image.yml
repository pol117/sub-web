name: Build & Push to Docker Hub

on:
  push:        
    tags: ["*.*.*"]               # 打 1.2.3 这样的 tag 时触发
  workflow_dispatch:                # 允许手动触发

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (enable cross-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: pol117/sub-web
          tags: |
            # release 分支推 latest
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/heads/release') }}
            # 每次构建一个 sha 标签，便于精准回滚
            type=sha
            # 打 tag 时（如 v1.2.3）推送 1.2.3 与 1.2
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & Push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
